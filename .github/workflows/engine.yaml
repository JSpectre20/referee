# Engine v0: ISA toolchain (generator, assembler, model) now; RTL lockstep and
# formal jobs are added as the engine checkpoints land.
name: engine

on:
  push:
    paths:
      - "isa.yaml"
      - "tools/**"
      - "firmware/engine/**"
      - "src/engine*.v"
      - "src/edge_ts.v"
      - "src/verdict.v"
      - "test/tools/**"
      - "test/engine/**"
      - "formal/engine*"
      - "docs/isa-timing.md"
      - ".github/workflows/engine.yaml"
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Generated files are up to date with isa.yaml
        run: python3 tools/isagen.py --check

      - name: Generator, assembler and model tests
        run: cd test && pytest tools -v
