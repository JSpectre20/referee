# Verdict soundness (src/verdict.v on src/edge_ts.v, judged through src/snapshot.v):
# SymbiYosys at tick resolution, plus the combinational theorem on verdict.v alone.
name: verdict

on:
  push:
    paths:
      - "src/verdict.v"
      - "src/edge_ts.v"
      - "src/snapshot.v"
      - "formal/verdict.sby"
      - "formal/verdict_formal.sv"
      - "formal/verdict_comb.sv"
      - ".github/workflows/verdict.yaml"
  workflow_dispatch:

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  # avoid the anonymous API rate limit

      - name: Soundness proofs, snapshot lemma, combinational theorem, covers, negative controls (must fail)
        run: |
          cd formal
          sby -f verdict.sby
          # sby exits 0 for u1 only because of `expect fail`;
          # check each task's status explicitly so a silent change is caught.
          for t in bmc4 prove4 prove8 cover4 sharp4 sharp8 comb comb_cover; do
            grep -q '^PASS' verdict_$t/status || { echo "verdict_$t: $(cat verdict_$t/status)"; exit 1; }
          done
          for t in u1 glitch comb_onesided comb_u1; do
            grep -q '^FAIL' verdict_$t/status || { echo "verdict_$t should FAIL: $(cat verdict_$t/status)"; exit 1; }
          done
