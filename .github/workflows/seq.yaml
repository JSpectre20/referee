# Sequencer (src/seq.v): cocotb tests and SymbiYosys proofs.
# Kept separate from test.yaml so the template's workflow stays untouched.
name: seq

# CI runs only at milestones (8 Nov gate, 13 Dec freeze, final): by hand (workflow_dispatch,
# on any branch) or when a pull request to main is opened / marked ready. Day-to-day work
# is verified locally (docs/local-flow.md). Not on every push: GitHub Actions minutes on a
# private repo ran out in three days of push-triggered runs (28 Oct).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths:
      - "src/seq.v"
      - "tools/seqasm.py"
      - "firmware/seq/**"
      - "test/seq/**"
      - "formal/seq.sby"
      - ".github/workflows/seq.yaml"

concurrency:  # a newer run of the same workflow on the same ref cancels the older one
  group: seq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r test/requirements.txt cocotbext-uart==0.1.4

      - name: Assembler self-check
        run: python3 tools/seqasm.py firmware/seq/uart_tx.s --timing

      - name: cocotb tests (UART decode + lockstep with the Python model)
        run: cd test && pytest seq -v

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}  # avoid the anonymous API rate limit

      - name: Prove, cover, and the negative control (must fail)
        run: |
          cd formal
          sby -f seq.sby
          # sby exits 0 for the mutant only because of `expect fail`;
          # check each task's status explicitly so a silent change is caught.
          grep -q '^PASS' seq_prove/status
          grep -q '^PASS' seq_cover/status
          grep -q '^FAIL' seq_mutant/status
